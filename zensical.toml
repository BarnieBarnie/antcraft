# The documentation site (https://barniebarnie.github.io/antcraft/), built with Zensical from docs/.
# Build it with `zensical build --strict` (`pip install zensical==0.0.73`, the version the docs workflow pins); CI does so on every pull request.
[project]
site_name = "AntCraft"
site_description = "A Fabric mod for Minecraft that adds bots you program in a small subset of Python."
site_url = "https://barniebarnie.github.io/antcraft/"
repo_url = "https://github.com/BarnieBarnie/antcraft"
repo_name = "BarnieBarnie/antcraft"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Features" = [
    { "Bots" = "features/bots.md" },
    { "Death & respawn" = "features/death.md" },
    { "Scripts in the game" = "features/scripts.md" },
    { "Nether travel" = "features/nether.md" },
    { "Colonies" = "features/colonies.md" },
    { "Default colony scripts" = "features/colony-scripts.md" },
    { "Mining" = "features/mining.md" },
    { "Blueprints" = "features/blueprints.md" },
    { "Commands" = "features/commands.md" },
    { "Config" = "features/config.md" },
    { "Server admins" = "features/server-admins.md" },
  ] },
  { "Language guide" = [
    "language/index.md",
    { "Values & types" = "language/values.md" },
    { "Control flow" = "language/control-flow.md" },
    { "Functions" = "language/functions.md" },
    { "Modules & import" = "language/modules.md" },
    { "Classes" = "language/classes.md" },
    { "Output & logging" = "language/output.md" },
    { "Errors & Result" = "language/errors.md" },
    { "Budget & pausing" = "language/budget.md" },
    { "What's not supported" = "language/not-supported.md" },
  ] },
  # Builtin pages (reference/<category>/<name>.md) stay out of the nav: the index lists them (see reference/template.md).
  { "API reference" = [
    "reference/index.md",
    { "Types" = [
      "reference/types/pos.md",
      "reference/types/block.md",
      "reference/types/stack.md",
      "reference/types/entity.md",
      "reference/types/result.md",
      "reference/types/selectors.md",
      "reference/types/memory.md",
      "reference/types/str.md",
      "reference/types/list.md",
      "reference/types/dict.md",
    ] },
    { "Library modules" = [
      "reference/modules/lib/home.md",
      "reference/modules/lib/shaft.md",
      "reference/modules/lib/mine.md",
      "reference/modules/colony/common.md",
    ] },
    { "Writing a page" = "reference/template.md" },
  ] },
  { "Cookbook" = [
    "cookbook/index.md",
    "cookbook/recover-items.md",
    "cookbook/farm.md",
    "cookbook/mining-loop.md",
    "cookbook/stock-chest.md",
    "cookbook/memory.md",
  ] },
  { "Development" = ["development/index.md"] },
  { "Design" = ["design/index.md"] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
